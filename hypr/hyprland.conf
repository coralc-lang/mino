# ============================================================
# Hyprland main config — plain .conf, multi-theme rice
# Plan: ~/.config/hypr/hypr-theme-rice-plan.md
# ============================================================

# --- Active theme (symlink managed by scripts/apply-theme.sh) ---
source = ~/.config/hypr/themes/current.conf

# --- Module includes (order matters) ---
source = ~/.config/hypr/conf.d/10-env.conf
source = ~/.config/hypr/conf.d/20-monitors.conf
source = ~/.config/hypr/conf.d/30-input.conf
source = ~/.config/hypr/conf.d/40-general.conf
source = ~/.config/hypr/conf.d/50-decoration.conf
source = ~/.config/hypr/conf.d/60-animations.conf
source = ~/.config/hypr/conf.d/70-binds.conf
source = ~/.config/hypr/conf.d/80-workspaces.conf
source = ~/.config/hypr/conf.d/90-windowrules.conf
source = ~/.config/hypr/conf.d/95-autostart.conf

# --- Screen-share portal snippet ---
source = ~/.config/hypr/xdph.conf
