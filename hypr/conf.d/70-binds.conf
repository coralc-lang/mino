# Keybinds

$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus
$menu = hyprlauncher

# --- Apps ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Space, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, firefox
bind = $mainMod, C, exec, zed
bind = $mainMod, G, exec, godot
bind = $mainMod, R, exec, kitty -e btop

# --- Window management ---
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod ALT, F, fullscreen, 1
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, Escape, exec, hyprctl kill

# --- Focus ---
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, semicolon, movefocus, r
bind = $mainMod, K, movefocus, u

# --- Move windows ---
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- Mouse ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Theme / panel / lock ---
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/theme-cycle.sh
bind = $mainMod, N, exec, ~/.config/hypr/scripts/toggle-waybar.sh
bind = $mainMod, L, exec, hyprlock

# --- Session ---
bind = $mainMod, M, exec, hyprctl dispatch exit
bind = CTRL ALT, Delete, exec, loginctl lock-session
bind = $mainMod, P, exec, hyprpicker -a -n

# --- Screenshots ---
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Region copied" || hyprctl notify 1 "Screenshot tools missing"
bind = $mainMod, Print, exec, grim - | wl-copy && notify-send "Screenshot" "Fullscreen copied" || hyprctl notify 1 "Screenshot tools missing"

# --- Media keys ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
