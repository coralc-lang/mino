# Decoration — sharp corners, subtle glass
# Values from themes/current.conf where noted

decoration {
    rounding = 0

    active_opacity = 0.92
    inactive_opacity = 0.82
    fullscreen_opacity = 1.0

    dim_inactive = false
    dim_strength = 0.1
    dim_special = 0.3

    # Shadow
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = $shadow
        offset = 0, 2
    }

    # Blur + vibrancy
    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.15
        vibrancy_darkness = 0.4
        special = true
        popups = true
        new_optimizations = true
        ignore_opacity = false
    }

    # Slight overlap so borders sit tight with gaps=4/6
    # (no extra border extend needed at rounding=0)
}
