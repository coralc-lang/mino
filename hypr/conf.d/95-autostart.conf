# Autostart — services live in systemd; only one-shots here

# Portals
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user start hyprpolkitagent

# Notification daemon (mako via systemd — also started below as fallback)
exec-once = systemctl --user start mako.service

# Wallpaper
exec-once = systemctl --user start hyprpaper.service

# Idle / lock
exec-once = systemctl --user start hypridle.service

# Hyprland cursor fix for remote/capture sessions (kept from previous setup)
exec-once = hyprctl setcursor default 24

# xhost for local root (was in old autostart)
exec-once = xhost +SI:localuser:root
