# Input

input {
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    natural_scroll = false

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        scroll_factor = 0.4
    }
}

# 3-finger horizontal workspace swipe (0.51+ gesture syntax)
gesture = 3, horizontal, workspace

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_forever = false
    workspace_swipe_create_new = true
}
