# General layout / gaps / borders
# Colors come from themes/current.conf ($accent, $border_dim, ...)

general {
    gaps_in = 4
    gaps_out = 6
    border_size = 1
    col.active_border = $accent
    col.inactive_border = $border_dim
    resize_on_border = true
    extend_border_grab_area = 8
    layout = dwindle
    allow_tearing = false
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
    default_split_ratio = 1.0
}

master {
    new_status = inherit
}
