# Window rules — Hyprland 0.53+ syntax
# anonymous: windowrule = <effect>, match:<prop> <value>
#            layerrule  = <effect>, match:namespace <value>

# Floats
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(org.gnome.Calculator)$
windowrule = float on, match:class ^(org.gnome.Nautilus)$, match:title ^(Copying|Moving)
windowrule = float on, match:class ^(hyprpicker)$
windowrule = float on, match:class ^(imv)$
windowrule = float on, match:class ^(mpv)$, match:title ^(Picture-in-Picture)$

# Opacity exceptions (keep full opacity for these)
windowrule = opaque on, match:class ^(firefox)$
windowrule = opaque on, match:class ^(kitty)$
windowrule = opaque on, match:class ^(org.gnome.Nautilus)$

# Idle inhibit while fullscreen
windowrule = idle_inhibit fullscreen, match:fullscreen true

# Layer rules — waybar side panel + mako notifications
layerrule = blur on, match:namespace ^waybar$
layerrule = ignore_alpha 0, match:namespace ^waybar$
layerrule = blur on, match:namespace ^notifications$
layerrule = ignore_alpha 0, match:namespace ^notifications$
layerrule = blur on, match:namespace ^mako$
layerrule = ignore_alpha 0, match:namespace ^mako$
