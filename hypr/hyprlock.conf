# mino hyprlock (generated)
$font = JetBrains Mono Nerd Font

general {
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
    grace = 0
}

background {
    monitor =
    path = /home/cerie/Pictures/wallpapers/digital-art-dark-cosmic-night-sky.jpg
    blur_passes = 4
    blur_size = 8
    noise = 0.015
    contrast = 0.85
    brightness = 0.45
    vibrancy = 0.25
    vibrancy_darkness = 0.55
}

shape {
    monitor =
    size = 100%, 2
    color = rgba(88c0d088)
    position = 0, 42%
    halign = center
    valign = top
    rounding = 0
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgba(e5e9f0ff)
    position = 0, 22%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A | %B %d"
    font_size = 16
    font_family = $font
    color = rgba(8b949edd)
    position = 0, 10%
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 13
    font_family = $font
    color = rgba(88c0d0ff)
    position = 0, -4%
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(88c0d0cc)
    inner_color = rgba(0f1419f0)
    font_color = rgba(e5e9f0ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##8b949e">password</span>
    fail_text = <span foreground="##ff7b72">\( $FPRINTFAIL \)</span>
    check_color = rgba(7ee787ff)
    fail_color = rgba(ff7b72ff)
    capslock_color = rgba(e3b341ff)
    numlock_color = rgba(e3b341ff)
    position = 0, -18%
    halign = center
    valign = center
    rounding = 0
}

label {
    monitor =
    text = press enter to unlock
    font_size = 12
    font_family = $font
    color = rgba(8b949eaa)
    position = 0, -30%
    halign = center
    valign = center
}

shape {
    monitor =
    size = 100%, 2
    color = rgba(88c0d055)
    position = 0, -42%
    halign = center
    valign = bottom
    rounding = 0
}
