# mino hyprlock (generated)
$font = JetBrains Mono Nerd Font

general {
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
    grace = 0
}

background {
    monitor =
    path = /home/cerie/Pictures/wallpapers/arch_dark.png
    blur_passes = 4
    blur_size = 8
    noise = 0.015
    contrast = 0.85
    brightness = 0.45
    vibrancy = 0.25
    vibrancy_darkness = 0.55
}

shape {
    monitor =
    size = 100%, 2
    color = rgba(e09f6a88)
    position = 0, 42%
    halign = center
    valign = top
    rounding = 0
}

label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = $font
    color = rgba(f0e6d8ff)
    position = 0, 22%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A · %B %d"
    font_size = 16
    font_family = $font
    color = rgba(a09080dd)
    position = 0, 10%
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 13
    font_family = $font
    color = rgba(e09f6aff)
    position = 0, -4%
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(e09f6acc)
    inner_color = rgba(14110ef0)
    font_color = rgba(f0e6d8ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##a09080">password</span>
    fail_text = <span foreground="##e06c75">\( $FPRINTFAIL \)</span>
    check_color = rgba(98c379ff)
    fail_color = rgba(e06c75ff)
    capslock_color = rgba(e5c07bff)
    numlock_color = rgba(e5c07bff)
    position = 0, -18%
    halign = center
    valign = center
    rounding = 0
}

label {
    monitor =
    text = enter to unlock
    font_size = 12
    font_family = $font
    color = rgba(a09080aa)
    position = 0, -30%
    halign = center
    valign = center
}

shape {
    monitor =
    size = 100%, 2
    color = rgba(e09f6a55)
    position = 0, -42%
    halign = center
    valign = bottom
    rounding = 0
}
