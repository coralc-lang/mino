# mino hyprlock
$font = JetBrains Mono Nerd Font

general {
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
    grace = 0
}

background {
    monitor =
    path = /home/cerie/Pictures/wallpapers/digital-art-moon-tree-wallpaper.jpg
    blur_passes = 4
    blur_size = 8
    noise = 0.015
    contrast = 0.85
    brightness = 0.45
    vibrancy = 0.25
    vibrancy_darkness = 0.55
}

# top accent bar
shape {
    monitor =
    size = 100%, 2
    color = rgba(b48ead88)
    position = 0, 40%
    halign = center
    valign = top
    rounding = 0
}

label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = $font
    color = rgba(e8e4f0ff)
    position = 0, 12%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A · %B %d"
    font_size = 16
    font_family = $font
    color = rgba(8e86a0dd)
    position = 0, 4%
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 13
    font_family = $font
    color = rgba(b48eadff)
    position = 0, -8%
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(b48eadcc)
    inner_color = rgba(12101af0)
    font_color = rgba(e8e4f0ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##8e86a0">password</span>
    fail_text = <span foreground="##ff6b8a">\( $FPRINTFAIL \)</span>
    check_color = rgba(a8e6a1ff)
    fail_color = rgba(ff6b8aff)
    capslock_color = rgba(e8c47aff)
    numlock_color = rgba(e8c47aff)
    position = 0, -18%
    halign = center
    valign = center
    rounding = 0
}

label {
    monitor =
    text = enter to unlock
    font_size = 12
    font_family = $font
    color = rgba(8e86a0aa)
    position = 0, -26%
    halign = center
    valign = center
}

# bottom accent bar
shape {
    monitor =
    size = 100%, 2
    color = rgba(b48ead55)
    position = 0, -40%
    halign = center
    valign = bottom
    rounding = 0
}
